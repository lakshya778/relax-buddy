<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RelaxBuddy – AI Emotional Support</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="wall-default">

<!-- AUTH MODAL -->
<div id="authModal" class="auth-modal">
  <div class="auth-box">
    <h2>Welcome to RelaxBuddy</h2>

    <input id="loginUser" type="text" placeholder="Username" />
    <input id="loginPass" type="password" placeholder="Password" />

    <button id="loginBtn" class="btn-primary">Login</button>
    <button id="signupBtn" class="btn-secondary">Sign Up</button>
  </div>
</div>

<!-- PROFILE MODAL -->
<div id="profileModal" class="modal-overlay">
  <div class="modal">
    <h2>Profile Settings</h2>

    <label>Display Name</label>
    <input id="profileName" type="text" placeholder="Your name" />

    <label>Avatar Initials</label>
    <input id="profileAvatar" type="text" maxlength="2" placeholder="AB" />

    <button id="profileSave" class="btn-primary">Save</button>
    <button id="profileCancel" class="btn-secondary">Cancel</button>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">RelaxBuddy</h2>

    <!-- New Chat -->
    <button id="newSessionBtn" class="newchat-anim btn-primary">+ New Chat</button>

    <!-- Search -->
    <input id="sessionSearch" class="session-search" type="text" placeholder="Search chats..." />

    <!-- Sections -->
    <div class="sidebar-sections">

      <div class="section">
        <div class="section-header" data-sec="pinned">
          📌 Pinned <span class="section-badge">0</span>
        </div>
        <div id="sectionPinned" class="section-body"></div>
      </div>

      <div class="section">
        <div class="section-header" data-sec="today">
          🟢 Today <span class="section-badge">0</span>
        </div>
        <div id="sectionToday" class="section-body"></div>
      </div>

      <div class="section">
        <div class="section-header" data-sec="yesterday">
          🟡 Yesterday <span class="section-badge">0</span>
        </div>
        <div id="sectionYesterday" class="section-body"></div>
      </div>

      <div class="section">
        <div class="section-header" data-sec="older">
          📘 Older <span class="section-badge">0</span>
        </div>
        <div id="sectionOlder" class="section-body"></div>
      </div>

    </div>

    <!-- Resizer -->
    <div class="sidebar-resizer"></div>
  </aside>

  <!-- CHAT AREA -->
  <main class="chat-area">

    <!-- HEADER -->
    <div class="chat-header">

      <!-- Sidebar toggle -->
      <button id="sidebarToggle" class="icon-btn">☰</button>

      <h3 id="activeChatTitle">Online</h3>

      <!-- Tools -->
      <div class="chat-tools">

        <!-- Voice selector -->
        <div class="voice-selector">
          <button id="enMaleBtn" class="vs-btn">EN Male</button>
          <button id="enFemaleBtn" class="vs-btn">EN Female</button>
          <button id="hiMaleBtn" class="vs-btn">HI Male</button>
          <button id="hiFemaleBtn" class="vs-btn">HI Female</button>
        </div>

        <!-- Auto voice -->
        <button id="maleBtn" class="icon-btn">👨</button>
        <button id="femaleBtn" class="icon-btn">👩</button>

        <!-- Tools -->
        <button id="searchBtn" class="icon-btn">🔍</button>
        <button id="exportBtn" class="icon-btn">📄</button>
        <button id="lockBtn" class="icon-btn">🔒</button>
        <button id="deleteBtn" class="icon-btn">🗑️</button>

        <!-- Theme -->
        <button id="themeToggle" class="icon-btn">🌙</button>

        <!-- Wallpaper -->
        <select id="wallpaperSelect" class="wallpaper-select">
          <option value="wall-default">Default</option>
          <option value="wall-nature">Nature</option>
          <option value="wall-lavender">Lavender</option>
          <option value="wall-dark">Dark</option>
        </select>

        <!-- Emoji -->
        <button id="emojiBtn" class="icon-btn">😊</button>

        <!-- Voice -->
        <button id="voiceToggleBtn" class="icon-btn">🎤</button>

        <!-- Profile -->
        <button id="profileOpenBtn" class="icon-btn">👤</button>
      </div>
    </div>

    <!-- Emoji Picker -->
    <div id="emojiPicker" class="emoji-picker"></div>

    <!-- Messages -->
    <div id="messages" class="messages"></div>

    <!-- Floating typing -->
    <div id="floatingTyping" class="floating-typing">
      <div class="typing-bubble">
        <div class="typing">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- Composer -->
    <div class="composer">
      <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
      <button id="sendBtn" class="send-btn btn-primary">Send</button>
    </div>

  </main>
</div>

<script src="script.js" defer></script>
</body>
</html>
